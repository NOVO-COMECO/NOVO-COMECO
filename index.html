
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVO COMEÇO | Cadastro</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    .container {
      max-width: 520px;
      margin: 25px auto;
      padding: 25px;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      margin-bottom: 8px;
      color: #166534;
    }

    header p {
      color: #64748b;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
      background: white;
    }

    input:focus, textarea:focus, select:focus {
      outline: 2px solid #86efac;
      border-color: #15803d;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #15803d;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #94a3b8;
      cursor: wait;
    }

    #mensagem {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    #mensagem.sucesso {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    #mensagem.erro {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .nota {
      margin-top: 18px;
      font-size: 13px;
      color: #64748b;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <main class="container">
    <header>
      <h1>NOVO COMEÇO</h1>
      <p>Preencha os dados abaixo para realizar o seu cadastro.</p>
    </header>

    <form id="formCadastro">
      <label for="nome">Nome completo</label>
      <input
        type="text"
        id="nome"
        name="nome"
        autocomplete="name"
        required
      >

      <label for="idade">Idade</label>
      <input
        type="number"
        id="idade"
        name="idade"
        min="1"
        max="120"
        required
      >

      <label for="telefone">Número de telefone</label>
      <input
        type="tel"
        id="telefone"
        name="telefone"
        autocomplete="tel"
        required
      >

      <label for="residencia">Residência</label>
      <input
        type="text"
        id="residencia"
        name="residencia"
        autocomplete="street-address"
        required
      >

      <label for="motivo">Motivo do cadastro</label>
      <textarea
        id="motivo"
        name="motivo"
        placeholder="Explique o motivo do seu cadastro..."
        required
      ></textarea>

      <button type="submit" id="botaoEnviar">
        Enviar cadastro
      </button>

      <div id="mensagem" role="status" aria-live="polite"></div>
    </form>

    <p class="nota">
      Os dados fornecidos devem ser verdadeiros.
      Evite partilhar informações pessoais fora dos canais autorizados.
    </p>
  </main>

  <!-- Biblioteca oficial do Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // 1. SUBSTITUA ESTES DOIS VALORES PELOS DO SEU PROJETO SUPABASE
    const SUPABASE_URL = "COLOQUE_AQUI_O_PROJECT_URL";
    const SUPABASE_ANON_KEY = "COLOQUE_AQUI_A_CHAVE_PUBLICAVEL";

    const form = document.getElementById("formCadastro");
    const botao = document.getElementById("botaoEnviar");
    const mensagem = document.getElementById("mensagem");

    let supabaseClient = null;

    // Preparar a ligação ao Supabase
    try {
      if (
        SUPABASE_URL.startsWith("https://") &&
        !SUPABASE_URL.includes(eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtodmZweHBneGlseHh5cXVmY3hqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwMDAwNzksImV4cCI6MjEwODU3NjA3OX0.2jm3sJ0rX8uvGsJIxE-Udm6mwqeKBbS3tuqlMmft0rk &&
        SUPABASE_ANON_KEY.length > 20 &&
        !SUPABASE_ANON_KEY.includes(eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtodmZweHBneGlseHh5cXVmY3hqIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc5MzAwMDA3OSwiZXhwIjoyMTA4NTc2MDc5fQ.74KnipHnIEp3SBuaPwpzy9vh6kbQ4fSKXnZPlWtI3gs &&
        window.supabase
      ) {
        supabaseClient = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_ANON_KEY
        );
      }
    } catch (erro) {
      console.error("Erro ao preparar o Supabase:", erro);
    }

    function mostrarMensagem(texto, tipo) {
      mensagem.textContent = texto;
      mensagem.className = tipo;
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      if (!form.reportValidity()) {
        return;
      }

      if (!supabaseClient) {
        mostrarMensagem(
          "A ligação à base de dados ainda não está configurada. Verifique o Project URL e a chave publicável.",
          "erro"
        );
        return;
      }

      const dados = {
        nome: document.getElementById("nome").value.trim(),
        idade: Number(document.getElementById("idade").value),
        telefone: document.getElementById("telefone").value.trim(),
        residencia: document.getElementById("residencia").value.trim(),
        motivo: document.getElementById("motivo").value.trim()
      };

      if (
        !dados.nome ||
        !Number.isInteger(dados.idade) ||
        dados.idade < 1 ||
        !dados.telefone ||
        !dados.residencia ||
        !dados.motivo
      ) {
        mostrarMensagem(
          "Verifique os dados preenchidos e tente novamente.",
          "erro"
        );
        return;
      }

      botao.disabled = true;
      botao.textContent = "A enviar...";
      mensagem.className = "";
      mensagem.textContent = "";

      try {
        const { error } = await supabaseClient
          .from("cadastros")
          .insert([dados]);

        if (error) {
          console.error("Erro do Supabase:", error);
          mostrarMensagem(
            "Não foi possível guardar o cadastro. Verifique a configuração da tabela e as permissões do Supabase.",
            "erro"
          );
          return;
        }

        mostrarMensagem(
          "Cadastro enviado e guardado com sucesso!",
          "sucesso"
        );

        form.reset();

      } catch (erro) {
        console.error("Erro ao enviar o cadastro:", erro);
        mostrarMensagem(
          "Ocorreu um erro de ligação. Verifique a Internet e tente novamente.",
          "erro"
        );
      } finally {
        botao.disabled = false;
        botao.textContent = "Enviar cadastro";
      }
    });
  </script>
</body>
</html>
