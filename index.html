
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVO COMEÇO — Cadastro</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    .container {
      max-width: 520px;
      margin: 25px auto;
      padding: 25px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 5px 20px #00000012;
    }

    header { text-align: center; margin-bottom: 25px; }
    header h1 { color: #166534; }
    header p { color: #64748b; line-height: 1.5; }

    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: bold;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea { min-height: 100px; resize: vertical; }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #15803d;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: 0.65; cursor: wait; }

    #mensagem {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    #mensagem.sucesso {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    #mensagem.erro {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .nota {
      margin-top: 18px;
      color: #64748b;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <main class="container">
    <header>
      <h1>NOVO COMEÇO</h1>
      <p>Preencha os seus dados para realizar o cadastro.</p>
    </header>

    <form id="formCadastro">
      <label for="nome">Nome completo</label>
      <input id="nome" name="nome" type="text"
             autocomplete="name" required>

      <label for="idade">Idade</label>
      <input id="idade" name="idade" type="number"
             min="1" max="120" step="1" required>

      <label for="telefone">Telefone</label>
      <input id="telefone" name="telefone" type="tel"
             autocomplete="tel" required>

      <label for="residencia">Residência</label>
      <input id="residencia" name="residencia" type="text"
             autocomplete="street-address" required>

      <label for="motivo">Motivo do cadastro</label>
      <textarea id="motivo" name="motivo"
                placeholder="Escreva o motivo do seu cadastro..."
                required></textarea>

      <button id="botaoEnviar" type="submit">
        Enviar cadastro
      </button>

      <div id="mensagem" role="status" aria-live="polite"></div>
    </form>

    <p class="nota">
      Os dados serão enviados para a base de dados do projeto.
      Forneça apenas informações necessárias ao cadastro.
    </p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // CONFIGURAÇÃO DO SUPABASE
    const SUPABASE_URL =
      "https://khvfpxpgxilxxyqufcxj.supabase.co";

    // Substitua pelo valor da chave pública do MESMO projeto.
    const SUPABASE_ANON_KEY =
      "COLOQUE_AQUI_A_CHAVE_PUBLICAVEL_DO_MESMO_PROJETO";

    const form = document.getElementById("formCadastro");
    const botao = document.getElementById("botaoEnviar");
    const mensagem = document.getElementById("mensagem");

    let supabaseClient = null;

    if (
      window.supabase &&
      SUPABASE_URL.startsWith("https://") &&
      !SUPABASE_ANON_KEY.includes("COLOQUE_AQUI")
    ) {
      supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );
    }

    function mostrarMensagem(texto, tipo) {
      mensagem.textContent = texto;
      mensagem.className = tipo;
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      if (!form.reportValidity()) return;

      if (!supabaseClient) {
        mostrarMensagem(
          "A ligação ainda não está configurada. Confirme o URL e a chave publicável.",
          "erro"
        );
        return;
      }

      const dados = {
        nome: document.getElementById("nome").value.trim(),
        idade: Number(document.getElementById("idade").value),
        telefone: document.getElementById("telefone").value.trim(),
        residencia: document.getElementById("residencia").value.trim(),
        motivo: document.getElementById("motivo").value.trim()
      };

      if (
        !dados.nome ||
        !Number.isInteger(dados.idade) ||
        dados.idade < 1 ||
        !dados.telefone ||
        !dados.residencia ||
        !dados.motivo
      ) {
        mostrarMensagem(
          "Verifique todos os campos e tente novamente.",
          "erro"
        );
        return;
      }

      botao.disabled = true;
      botao.textContent = "A enviar...";
      mensagem.className = "";

      try {
        const { error } = await supabaseClient
          .from("cadastros")
          .insert([dados]);

        if (error) {
          console.error("Erro Supabase:", error);
          mostrarMensagem(
            "Não foi possível guardar o cadastro. Confirme as colunas da tabela e as permissões de inserção.",
            "erro"
          );
          return;
        }

        mostrarMensagem(
          "Cadastro enviado e guardado com sucesso!",
          "sucesso"
        );
        form.reset();

      } catch (erro) {
        console.error("Erro de ligação:", erro);
        mostrarMensagem(
          "Erro de ligação. Verifique a Internet e tente novamente.",
          "erro"
        );
      } finally {
        botao.disabled = false;
        botao.textContent = "Enviar cadastro";
      }
    });
  </script>
</body>
</html>
